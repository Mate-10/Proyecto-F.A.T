{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Iniciar sesión</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

    <div class="contenedor">

        <div class="tarjeta">

            <h1>Emergencia</h1>

            <p class="subtitulo">
                Iniciá sesión para continuar
            </p>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <input
                    type="email"
                    name="email"
                    placeholder="Correo electrónico"
                    required
                >

                <input
                    type="password"
                    name="contrasena"
                    placeholder="Contraseña"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <p class="cambio">

                ¿No tenés una cuenta?

                <a href="{% url 'registro' %}">
                    Crear cuenta
                </a>

            </p>

        </div>

    </div>

</body>
</html>
